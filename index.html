<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Summary Component</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link
      rel="shortcut icon"
      href="assets/images/favicon-32x32.png"
      type="image/x-icon"
    />
  </head>

  <body>
    <header></header>
    <nav></nav>

    <main>
      <section class="content">
        <div class="result">
          <h2>You result</h2>
          <div>
            <span>76</span>
            <span>of 100</span>
          </div>
          <h3>Great</h3>
          <p>
            You scored higher that 65% of the people who have taken these tests.
          </p>
        </div>
        <div class="summary">
          <h2>Summary</h2>
          <ul class="list">
            <li class="reaction">
              <p>Reaction</p>
              <p><span>80</span><span> / 100</span></p>
            </li>
            <li class="memory">
              <p>Memory</p>
              <p><span>92</span><span> / 100</span></p>
            </li>
            <li class="verbal">
              <p>Verbal</p>
              <p><span>92</span><span> / 100</span></p>
            </li>
            <li class="visual">
              <p>Visual</p>
              <p><span>92</span><span> / 100</span></p>
            </li>
          </ul>
          <button type="submit">Continue</button>
        </div>
      </section>
      <aside></aside>
    </main>
  </body>
</html>
